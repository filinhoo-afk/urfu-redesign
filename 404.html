<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — УрФУ</title>
  <script>/* GitHub Pages отдаёт 404 на любом пути — относительные ссылки считаем от корня сайта */
    if (location.hostname.endsWith('github.io')) document.write('<base href="/' + location.pathname.split('/')[1] + '/">');</script>
  <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .nf { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 64px 0; }
    .nf__code { font-size: clamp(96px, 18vw, 200px); font-weight: 800; letter-spacing: -.06em; line-height: 1; background: linear-gradient(135deg, var(--brand), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nf .search-xl { max-width: 520px; margin: 32px auto 0; }
    .nf .search-xl .input { color: var(--text-3); text-align: left; }
  </style>
</head>
<body data-page="404">
  <div id="site-header"></div>
  <main id="main" class="nf">
    <div class="container stack" style="align-items:center">
      <div class="nf__code" aria-hidden="true">404</div>
      <h1 class="h2">Такой страницы нет — но мы поможем найти нужное</h1>
      <p class="lead">Возможно, она переехала при обновлении сайта. Попробуй поиск или начни с главной.</p>
      <div class="search-xl input-icon" style="width:100%"><i data-icon="search"></i><button class="input" data-search-open>Что ищешь? Например, «расписание»</button></div>
      <div class="cluster" style="justify-content:center;margin-top:16px">
        <a class="btn" href="index.html"><i data-icon="home"></i> На главную</a>
        <a class="btn btn--ghost" href="help.html"><i data-icon="help"></i> Центр помощи</a>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/app.js"></script>
</body>
</html>
